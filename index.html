<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Registro personal de gastos por periodo de tarjeta." />
  <title>Finanzas personales</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Control de tarjeta</p>
        <h1>Gastos del periodo</h1>
        <p id="periodLabel" class="period-label"></p>
      </div>
      <div class="header-summary" aria-live="polite">
        <span>Total del periodo</span>
        <strong id="periodTotal">$0.00</strong>
      </div>
    </header>

    <section class="card" aria-labelledby="expenseFormTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Nuevo movimiento</p>
          <h2 id="expenseFormTitle">Capturar gasto</h2>
        </div>
        <button id="cancelEditButton" class="button button-secondary hidden" type="button">
          Cancelar edición
        </button>
      </div>

      <form id="expenseForm" novalidate>
        <input id="expenseId" type="hidden" />

        <div class="form-grid">
          <div class="field">
            <label for="expenseDate">Fecha</label>
            <input id="expenseDate" name="date" type="date" required />
            <small id="dateError" class="field-error"></small>
          </div>

          <div class="field field-wide">
            <label for="expenseConcept">Concepto</label>
            <input
              id="expenseConcept"
              name="concept"
              type="text"
              maxlength="80"
              placeholder="Ej. Uber Eats"
              autocomplete="off"
              required
            />
            <small id="conceptError" class="field-error"></small>
          </div>

          <div class="field">
            <label for="expenseType">Tipo</label>
            <select id="expenseType" name="type" required>
              <option value="">Selecciona un tipo</option>
            </select>
            <small id="typeError" class="field-error"></small>
          </div>

          <div class="field">
            <label for="expenseAmount">Costo</label>
            <div class="currency-input">
              <span aria-hidden="true">$</span>
              <input
                id="expenseAmount"
                name="amount"
                type="number"
                min="0.01"
                step="0.01"
                inputmode="decimal"
                placeholder="0.00"
                required
              />
            </div>
            <small id="amountError" class="field-error"></small>
          </div>
        </div>

        <div class="form-actions">
          <button id="submitButton" class="button button-primary" type="submit">
            Agregar gasto
          </button>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="expensesTableTitle">
      <div class="section-heading table-heading">
        <div>
          <p class="eyebrow">Periodo activo</p>
          <h2 id="expensesTableTitle">Movimientos registrados</h2>
        </div>
        <span id="expenseCount" class="count-badge">0 gastos</span>
      </div>

      <div id="emptyState" class="empty-state">
        <h3>Aún no hay gastos registrados</h3>
        <p>Captura tu primer movimiento para comenzar a llenar el periodo.</p>
      </div>

      <div id="tableContainer" class="table-container hidden">
        <table>
          <thead>
            <tr>
              <th scope="col">Fecha</th>
              <th scope="col">Concepto</th>
              <th scope="col">Tipo</th>
              <th scope="col" class="amount-column">Costo</th>
              <th scope="col" class="actions-column">Acciones</th>
            </tr>
          </thead>
          <tbody id="expensesTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
